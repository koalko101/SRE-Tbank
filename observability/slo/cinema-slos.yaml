version: prometheus/v1
service: cinema
labels:
  owner: cinema
  repo: cinema
  tier: 2
slos:
  - name: browse-availability
    objective: 99
    description: Successful catalog, search, details, cinema, screening, and seat map requests.
    sli:
      events:
        error_query: sum(rate(cinema_sli_requests_total{operation=~"catalog|movie_search|movie_details|cinema_list|screenings|seat_map",result="bad"}[{{.window}}]))
        total_query: sum(rate(cinema_sli_requests_total{operation=~"catalog|movie_search|movie_details|cinema_list|screenings|seat_map"}[{{.window}}]))
    alerting:
      name: CinemaBrowseAvailability
      page_alert:
        disable: true
      ticket_alert:
        disable: true
  - name: authentication-availability
    objective: 99.5
    description: Successful authentication and registration service responses.
    sli:
      events:
        error_query: sum(rate(cinema_sli_requests_total{operation=~"authentication|registration",result="bad"}[{{.window}}]))
        total_query: sum(rate(cinema_sli_requests_total{operation=~"authentication|registration"}[{{.window}}]))
    alerting:
      name: CinemaAuthenticationAvailability
      page_alert:
        disable: true
      ticket_alert:
        disable: true
  - name: booking-availability
    objective: 99.5
    description: Successful booking and ticket history requests.
    sli:
      events:
        error_query: sum(rate(cinema_sli_requests_total{operation=~"booking|ticket_history",result="bad"}[{{.window}}]))
        total_query: sum(rate(cinema_sli_requests_total{operation=~"booking|ticket_history"}[{{.window}}]))
    alerting:
      name: CinemaBookingAvailability
      page_alert:
        disable: true
      ticket_alert:
        disable: true
  - name: booking-under-one-second
    objective: 95
    description: Successful ticket bookings completed in one second or less.
    sli:
      events:
        error_query: sum(rate(cinema_booking_duration_seconds_count[{{.window}}])) - sum(rate(cinema_booking_duration_seconds_bucket{le="1.0"}[{{.window}}]))
        total_query: sum(rate(cinema_booking_duration_seconds_count[{{.window}}]))
    alerting:
      name: CinemaBookingLatency
      page_alert:
        disable: true
      ticket_alert:
        disable: true
  - name: catalog-probe-availability
    objective: 99.5
    description: Successful synthetic requests to the public movie catalog endpoint.
    sli:
      events:
        error_query: sum(count_over_time(probe_success{job="cinema-prober"}[{{.window}}])) - sum(sum_over_time(probe_success{job="cinema-prober"}[{{.window}}]))
        total_query: sum(count_over_time(probe_success{job="cinema-prober"}[{{.window}}]))
    alerting:
      name: CinemaCatalogProbeAvailability
      page_alert:
        disable: true
      ticket_alert:
        disable: true
