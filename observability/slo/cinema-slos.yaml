
version: prometheus/v1
service: cinema
labels:
  owner: cinema
  repo: cinema
  tier: 2

slos:
  - name: browse-availability
    objective: 99
    description: Successful catalog, search, details, cinema, screening, and seat map requests.
    sli:
      events:
        error_query: sum(rate(cinema_sli_requests_total{operation=~"catalog|movie_search|movie_details|cinema_list|screenings|seat_map",result="bad"}[{{.window}}]))
        total_query: sum(rate(cinema_sli_requests_total{operation=~"catalog|movie_search|movie_details|cinema_list|screenings|seat_map"}[{{.window}}]))
    alerting:
      name: CinemaBrowseAvailability
      labels:
        service: cinema
        team: cinema
      page_alert:
        labels:
          severity: critical
        annotations:
          summary: "Критическая недоступность каталога"
          description: "Пользователи не могут полноценно просматривать каталог, искать фильмы и получать информацию о сеансах. Проверьте backend и PostgreSQL."
      ticket_alert:
        labels:
          severity: warning
        annotations:
          summary: "Ухудшение доступности каталога"
          description: "Растёт количество ошибок при просмотре каталога и поиске фильмов. Проверьте backend и PostgreSQL."

  - name: authentication-availability
    objective: 99.5
    description: Successful authentication and registration service responses.
    sli:
      events:
        error_query: sum(rate(cinema_sli_requests_total{operation=~"authentication|registration",result="bad"}[{{.window}}]))
        total_query: sum(rate(cinema_sli_requests_total{operation=~"authentication|registration"}[{{.window}}]))
    alerting:
      name: CinemaAuthenticationAvailability
      labels:
        service: cinema
        team: cinema
      page_alert:
        labels:
          severity: critical
        annotations:
          summary: "Критическая недоступность авторизации"
          description: "Пользователи не могут войти в систему или зарегистрироваться. Проверьте backend, PostgreSQL и Valkey."
      ticket_alert:
        labels:
          severity: warning
        annotations:
          summary: "Ухудшение доступности авторизации"
          description: "Увеличилось количество ошибок входа и регистрации. Проверьте backend, PostgreSQL и работу rate limiting."

  - name: booking-availability
    objective: 99.5
    description: Successful booking and ticket history requests.
    sli:
      events:
        error_query: sum(rate(cinema_sli_requests_total{operation=~"booking|ticket_history",result="bad"}[{{.window}}]))
        total_query: sum(rate(cinema_sli_requests_total{operation=~"booking|ticket_history"}[{{.window}}]))
    alerting:
      name: CinemaBookingAvailability
      labels:
        service: cinema
        team: cinema
      page_alert:
        labels:
          severity: critical
        annotations:
          summary: "Критическая недоступность бронирования"
          description: "Пользователи не могут бронировать билеты или просматривать историю покупок. Проверьте PostgreSQL и транзакции бронирования."
      ticket_alert:
        labels:
          severity: warning
        annotations:
          summary: "Ухудшение доступности бронирования"
          description: "Увеличилось количество ошибок бронирования и получения истории покупок. Проверьте SQL-запросы и логи backend."

  - name: booking-under-one-second
    objective: 95
    description: Successful ticket bookings completed in one second or less.
    sli:
      events:
        error_query: sum(rate(cinema_booking_duration_seconds_count[{{.window}}])) - sum(rate(cinema_booking_duration_seconds_bucket{le="1.0"}[{{.window}}]))
        total_query: sum(rate(cinema_booking_duration_seconds_count[{{.window}}]))
    alerting:
      name: CinemaBookingLatency
      labels:
        service: cinema
        team: cinema
      page_alert:
        labels:
          severity: critical
        annotations:
          summary: "Критическое замедление бронирования"
          description: "Большинство бронирований выполняется с недопустимыми задержками. Проверьте PostgreSQL и нагрузку на backend."
      ticket_alert:
        labels:
          severity: warning
        annotations:
          summary: "Увеличение времени бронирования"
          description: "Растёт доля бронирований длительностью более одной секунды. Проверьте производительность SQL-запросов и нагрузку на backend."

  - name: catalog-probe-availability
    objective: 99.5
    description: Successful synthetic requests to the public movie catalog endpoint.
    sli:
      events:
        error_query: sum(count_over_time(probe_success{job="cinema-prober"}[{{.window}}])) - sum(sum_over_time(probe_success{job="cinema-prober"}[{{.window}}]))
        total_query: sum(count_over_time(probe_success{job="cinema-prober"}[{{.window}}]))
    alerting:
      name: CinemaCatalogProbeAvailability
      labels:
        service: cinema
        team: cinema
      page_alert:
        labels:
          severity: critical
        annotations:
          summary: "Публичный каталог недоступен"
          description: "Внешняя проверка не может получить каталог фильмов. Проверьте frontend, backend и сетевую доступность."
      ticket_alert:
        labels:
          severity: warning
        annotations:
          summary: "Нестабильная работа публичного каталога"
          description: "Внешняя проверка периодически завершается ошибкой. Проверьте доступность endpoint и логи компонентов."
