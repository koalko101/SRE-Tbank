fullnameOverride: blackbox-exporter

config:
  modules:
    cinema_api:
      prober: http
      timeout: 5s
      http:
        method: GET
        headers:
          X-Synthetic-Probe: cinema-blackbox
        valid_status_codes:
          - 200
        preferred_ip_protocol: ip4

service:
  type: ClusterIP
  port: 9115
