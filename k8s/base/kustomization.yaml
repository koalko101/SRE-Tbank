apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cinema

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - postgres.yaml
  - valkey.yaml

configMapGenerator:
  - name: cinema-config
    envs:
      - config/app.env
  - name: postgres-config
    envs:
      - config/postgres.env

labels:
  - pairs:
      app.kubernetes.io/part-of: cinema
    includeSelectors: false
