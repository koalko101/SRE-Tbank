apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cinema
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: cinema-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          env:
            - { name: ITEMS_PER_PAGE, valueFrom: { configMapKeyRef: { name: cinema-config, key: ITEMS_PER_PAGE } } }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cinema
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
