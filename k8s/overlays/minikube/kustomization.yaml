apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

secretGenerator:
  - name: cinema-secrets
    envs:
      - secrets.env

configMapGenerator:
  - name: cinema-config
    behavior: merge
    literals:
      - FRONTEND_URL=http://localhost:30080

labels:
  - pairs:
      app.kubernetes.io/part-of: cinema
    includeSelectors: false
