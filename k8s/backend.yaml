apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cinema
spec:
  replicas: 2
  strategy: { type: RollingUpdate }
  selector:
    matchLabels: { app: backend }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: cinema-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          env:
            - { name: DB_URL, valueFrom: { configMapKeyRef: { name: cinema-config, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { configMapKeyRef: { name: cinema-config, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: cinema-secrets, key: DB_PASSWORD } } }
            - { name: ITEMS_PER_PAGE, valueFrom: { configMapKeyRef: { name: cinema-config, key: ITEMS_PER_PAGE } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: cinema-secrets, key: JWT_SECRET } } }
            - { name: TEST_DATA_ENABLED, valueFrom: { configMapKeyRef: { name: cinema-config, key: TEST_DATA_ENABLED } } }
            - { name: FRONTEND_URL, valueFrom: { configMapKeyRef: { name: cinema-config, key: FRONTEND_URL } } }
            - { name: APP_SECURITY_CSRF_ENABLED, valueFrom: { configMapKeyRef: { name: cinema-config, key: APP_SECURITY_CSRF_ENABLED } } }
            - { name: ADMIN_EMAIL, valueFrom: { configMapKeyRef: { name: cinema-config, key: ADMIN_EMAIL } } }
            - { name: RATE_LIMIT_STORE_HOST, valueFrom: { configMapKeyRef: { name: cinema-config, key: RATE_LIMIT_STORE_HOST } } }
            - { name: RATE_LIMIT_STORE_PORT, valueFrom: { configMapKeyRef: { name: cinema-config, key: RATE_LIMIT_STORE_PORT } } }
            - { name: RATE_LIMIT_WINDOW_SECONDS, valueFrom: { configMapKeyRef: { name: cinema-config, key: RATE_LIMIT_WINDOW_SECONDS } } }
            - { name: RATE_LIMIT_DEFAULT_LIMIT, valueFrom: { configMapKeyRef: { name: cinema-config, key: RATE_LIMIT_DEFAULT_LIMIT } } }
            - { name: RATE_LIMIT_AUTH_LIMIT, valueFrom: { configMapKeyRef: { name: cinema-config, key: RATE_LIMIT_AUTH_LIMIT } } }
            - { name: RATE_LIMIT_PURCHASE_LIMIT, valueFrom: { configMapKeyRef: { name: cinema-config, key: RATE_LIMIT_PURCHASE_LIMIT } } }
            - { name: RATE_LIMIT_ADMIN_LIMIT, valueFrom: { configMapKeyRef: { name: cinema-config, key: RATE_LIMIT_ADMIN_LIMIT } } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: management }
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health, port: management }
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cinema
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
