apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: cinema
spec:
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports: [{ containerPort: 6379 }]
          command: ["valkey-server", "--save", "", "--appendonly", "no"]
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: cinema
spec:
  selector: { app: valkey }
  ports: [{ port: 6379, targetPort: 6379 }]
