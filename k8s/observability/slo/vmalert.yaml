apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert-slo
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert-slo
  template:
    metadata:
      labels:
        app: vmalert-slo
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.151.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/rules.yaml
            - -datasource.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            - -remoteWrite.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: cinema-slo-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert-slo
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: vmalert-slo
  ports:
    - name: http
      port: 8880
      targetPort: http
