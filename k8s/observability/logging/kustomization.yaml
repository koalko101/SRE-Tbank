apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - victoria-logs.yaml
  - victoria-logs-collector.yaml
  - vmalert.yaml

configMapGenerator:
  - name: vmalert-rules
    files:
      - alerts.yaml=config/alerts.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cinema-logging
    includeSelectors: false
