
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: logging
data:
  alerts.yaml: |
    groups:
      - name: cinema-auth
        type: vlogs
        interval: 1m
        rules:
          - alert: TooManyFailedLogins
            expr: '_time:5m kubernetes.pod_namespace:="cinema" kubernetes.container_name:="backend" event:="auth.login.failure" | stats count() as failures | filter failures:>5'
            for: 1m
            labels:
              severity: warning
              service: cinema-backend
            annotations:
              summary: "Too many failed login attempts"
              description: "More than 5 failed logins in 5 minutes. Current count: {{ $value }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.151.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/alerts.yaml
            - -datasource.url=http://victoria-logs.logging.svc.cluster.local:9428
            - -rule.defaultRuleType=vlogs
            - -httpListenAddr=:8880
            - -notifier.blackhole=true
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: logging
spec:
  type: ClusterIP
  selector:
    app: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
