apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.31.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - { name: http, containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager, readOnly: true }
            - { name: telegram, mountPath: /etc/alertmanager-secrets, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: telegram
          secret:
            secretName: telegram-secrets
            items:
              - { key: TG_BOT_TOKEN, path: token }
              - { key: CHAT_ID, path: chat_id }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: ClusterIP
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: http }
