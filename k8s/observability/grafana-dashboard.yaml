apiVersion: v1
kind: ConfigMap
metadata:
  name: cinema-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cinema-slo.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 0.99}]}}, "overrides": []},
          "gridPos": {"h": 9, "w": 16, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum(rate(cinema_sli_requests_total{result=\"good\"}[$__rate_interval])) by (operation) / sum(rate(cinema_sli_requests_total[$__rate_interval])) by (operation)", "legendFormat": "{{operation}} SLI", "refId": "A"},
            {"expr": "1 - slo:sli_error:ratio_rate30d{sloth_service=\"cinema\"}", "legendFormat": "{{sloth_slo}} SLO (30d)", "refId": "B"},
            {"expr": "slo:objective:ratio{sloth_service=\"cinema\"}", "legendFormat": "{{sloth_slo}} target", "refId": "C"}
          ],
          "title": "Request availability SLI and SLO",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 0.95}]}}, "overrides": []},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single"}},
          "targets": [
            {"expr": "sum(rate(cinema_booking_duration_seconds_bucket{le=\"1.0\"}[$__rate_interval])) / sum(rate(cinema_booking_attempts_total[$__rate_interval]))", "legendFormat": "Bookings within 1s", "refId": "A"},
            {"expr": "1 - slo:sli_error:ratio_rate30d{sloth_service=\"cinema\",sloth_slo=\"booking-under-one-second\"}", "legendFormat": "Booking latency SLO (30d)", "refId": "B"},
            {"expr": "slo:objective:ratio{sloth_service=\"cinema\",sloth_slo=\"booking-under-one-second\"}", "legendFormat": "Booking latency target", "refId": "C"}
          ],
          "title": "Booking latency SLI and SLO",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 0.985}]}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 9},
          "id": 3,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single"}},
          "targets": [
            {"expr": "sum(increase(cinema_sli_requests_total{result=\"good\"}[30d])) / sum(increase(cinema_sli_requests_total[30d]))", "legendFormat": "30d request success", "refId": "A"},
            {"expr": "vector(0.985)", "legendFormat": "SLA 98.5%", "refId": "B"}
          ],
          "title": "Monthly aggregate SLA",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "victoriametrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 0.995}]}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 9},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single"}},
          "targets": [
            {"expr": "min(probe_success)", "legendFormat": "API probe", "refId": "A"},
            {"expr": "vector(0.995)", "legendFormat": "Probe SLO 99.5%", "refId": "B"}
          ],
          "title": "External API probe",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["cinema", "sli", "slo", "sla"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Cinema SLI SLO SLA",
      "uid": "cinema-slo",
      "version": 1
    }
    
