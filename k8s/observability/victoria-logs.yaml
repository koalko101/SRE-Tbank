apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
  namespace: logging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-headless
  namespace: logging
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  namespace: logging
spec:
  serviceName: victoria-logs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=7d
            - -httpListenAddr=:9428
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: logging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
      protocol: TCP
