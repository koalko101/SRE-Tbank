apiVersion: v1
kind: ConfigMap
metadata:
  name: cinema-config
  namespace: cinema
data:
  DB_NAME: cinema
  DB_USER: cinema
  ITEMS_PER_PAGE: "4"
  DB_URL: jdbc:postgresql://postgres:5432/cinema
  TEST_DATA_ENABLED: "true"
  FRONTEND_URL: http://localhost:3000
  APP_SECURITY_CSRF_ENABLED: "false"
  ADMIN_EMAIL: "koalko99@gmail.com"
  RATE_LIMIT_STORE_HOST: valkey
  RATE_LIMIT_STORE_PORT: "6379"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_DEFAULT_LIMIT: "90"
  RATE_LIMIT_AUTH_LIMIT: "8"
  RATE_LIMIT_PURCHASE_LIMIT: "6"
  RATE_LIMIT_ADMIN_LIMIT: "120"
---
apiVersion: v1
kind: Secret
metadata:
  name: cinema-secrets
  namespace: cinema
type: Opaque
stringData:
  DB_PASSWORD: cinema
  JWT_SECRET: change-me-before-production-use-a-long-random-secret
