apiVersion: v1
kind: ConfigMap
metadata:
  name: cinema-config
  namespace: cinema
data:
  DB_NAME: cinema
  DB_USER: cinema
  ITEMS_PER_PAGE: "4"
  DB_URL: jdbc:postgresql://postgres:5432/cinema
  TEST_DATA_ENABLED: "true"
  FRONTEND_URL: http://localhost:3000
  APP_SECURITY_CSRF_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: cinema-secrets
  namespace: cinema
type: Opaque
stringData:
  DB_PASSWORD: cinema
  JWT_SECRET: change-me-before-production-use-a-long-random-secret
