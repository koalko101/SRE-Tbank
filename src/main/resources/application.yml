test-data:
  enabled: ${TEST_DATA_ENABLED:true}

items-on-pages:
  count: ${ITEMS_PER_PAGE:4}

spring:
  application:
    name: ticket-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DB_USER:cinema}
    password: ${DB_PASSWORD:cinema}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${RATE_LIMIT_STORE_HOST:localhost}
      port: ${RATE_LIMIT_STORE_PORT:6379}
      timeout: 500ms

logging:
  level:
    root: INFO
    com.cinema.ticket_booking: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{X-Correlation-Id}] %logger{36} - %msg%n"

server:
  port: ${PORT:8080}

app:
  rate-limit:
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    general-limit: ${RATE_LIMIT_DEFAULT_LIMIT:90}
    auth-limit: ${RATE_LIMIT_AUTH_LIMIT:8}
    purchase-limit: ${RATE_LIMIT_PURCHASE_LIMIT:6}
    admin-limit: ${RATE_LIMIT_ADMIN_LIMIT:120}
  admin:
    email: ${ADMIN_EMAIL:}
  security:
    csrf-enabled: ${APP_SECURITY_CSRF_ENABLED:false}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  server:
    address: 0.0.0.0
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
